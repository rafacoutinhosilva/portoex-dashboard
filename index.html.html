</script>
<style>
:root {
  --navy: #0c2340;
  --navy-dark: #081726;
  --blue-link: #2b6cb0;
  --blue-accent: #1e5ea8;
  --bg: #f4f6f9;
  --card: #ffffff;
  --border: #e2e6ec;
  --text: #1f2937;
  --text-muted: #6b7280;
  --green: #1a8a4a;
  --red: #c0392b;
  --amber: #b7791f;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
a { color: var(--blue-link); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* LOGIN */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%); }
.login-card { width: 380px; background: var(--card); border-radius: var(--radius); padding: 36px 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
.login-logo { text-align: center; margin-bottom: 6px; }
.login-logo .brand { font-weight: 700; font-size: 22px; color: var(--navy); letter-spacing: 0.5px; }
.login-logo .brand span { color: var(--blue-accent); }
.login-sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 26px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field input[type=text], .field input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
.field input:focus { border-color: var(--blue-accent); }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 44px; }
.pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); font-size: 12.5px; padding: 2px 4px; }
.pw-toggle:hover { color: var(--navy); }
.row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 13px; }
.remember { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
.btn-primary { width: 100%; background: var(--navy); color: #fff; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 600; }
.btn-primary:hover { background: var(--navy-dark); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.login-error { background: #fdecea; color: var(--red); border: 1px solid #f5c6c0; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px; display: none; }
.login-hint { margin-top: 18px; font-size: 11.5px; color: var(--text-muted); text-align: center; line-height: 1.5; }

/* APP SHELL */
.app-shell { display: none; min-height: 100vh; }
.app-shell.visible { display: flex; }
.login-wrap.hidden { display: none; }
.sidebar { width: 220px; background: var(--navy); color: #cbd5e1; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar .brand { padding: 20px 18px; font-weight: 700; font-size: 17px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar .brand span { color: #6fa8dc; }
.sidebar nav { flex: 1; padding: 12px 0; }
.sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 11px 20px; color: #cbd5e1; font-size: 14px; border-left: 3px solid transparent; cursor: pointer; }
.sidebar nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
.sidebar nav a.active { background: rgba(255,255,255,0.08); color: #fff; border-left-color: #6fa8dc; font-weight: 600; }
.sidebar .user-box { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12.5px; }
.sidebar .user-box .name { color: #fff; font-weight: 600; margin-bottom: 6px; }
.sidebar .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.25); color: #cbd5e1; border-radius: 6px; padding: 5px 10px; font-size: 12px; }
.sidebar .logout-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 58px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.topbar h1 { font-size: 17px; margin: 0; color: var(--navy); }
.content { padding: 22px 24px 40px; flex: 1; overflow-x: auto; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 22px; }
.kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.kpi-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
.kpi-card .value { font-size: 24px; font-weight: 700; color: var(--navy); }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
@media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.panel h3 { margin: 0 0 12px; font-size: 14px; color: var(--navy); }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 18px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.filters .f-field { display: flex; flex-direction: column; gap: 4px; }
.filters label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
.filters input, .filters select { padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; min-width: 140px; }
.btn-sm { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 13px; }
.btn-sm.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn-sm.primary:hover { background: var(--navy-dark); }
.btn-sm:hover { background: #f1f4f8; }
.preset-row { display: flex; gap: 6px; flex-wrap: wrap; }
.preset-row button.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data-table thead th { background: var(--navy); color: #fff; text-align: left; padding: 10px 12px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
table.data-table tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data-table tbody tr:hover { background: #f7f9fc; }
.badge-sim { color: var(--blue-link); font-weight: 600; }
.badge-nao { color: var(--text-muted); }
.editable-input { border: 1px solid transparent; background: transparent; font-size: 13px; padding: 4px 6px; border-radius: 5px; min-width: 90px; }
.editable-input:hover { border-color: var(--border); background: #fff; }
.editable-input:focus { border-color: var(--blue-accent); background: #fff; outline: none; }
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-size: 12.5px; color: var(--text-muted); }
.pagination .btns { display: flex; gap: 6px; }
.table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }

/* Mapa interativo */

<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo"><div class="brand">Porto<span>Ex</span> Dashboard</div></div>

<script>
/* ==========================================================================
   PortoExpress Dashboard — HTML + Supabase (banco de dados na nuvem)
   Os dados (usuarios, registros, importacoes) ficam salvos no Supabase —
   um projeto na nuvem que voce mesmo cria e controla. Isso significa que o
   historico fica disponivel em qualquer computador/celular, nao so nesse
   navegador. Veja supabase_schema.sql e o README para o passo a passo.
   ========================================================================== */

/* ---------- CONFIGURAÇÃO DO SUPABASE (preencha aqui) ---------- */

// "Project Settings" > "API" e copie a "Project URL" e a chave "anon public".

var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4aW5kcGNrcmFyY3htaWlyb2p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4Mjk4NTAsImV4cCI6MjEwMzQwNTg1MH0.0G7rC_4TsMtl9q_K1RpHBQdptnpNmXZXCdUpihB1IZc'; // <-- troque pela chave "anon public"

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


/* ---------- utilidades de tempo (iguais a versao com servidor) ---------- */
function hhmmToMinutes(value) {
  if (!value || typeof value !== 'string') return 0;
  var v = value.trim();
  if (v === '' || v === '-' || v === '--:--') return 0;
  var negative = false, str = v;
  if (str.startsWith('-')) { negative = true; str = str.slice(1); }
  var parts = str.split(':');
  if (parts.length < 2) return 0;
  var hours = parseInt(parts[0], 10), minutes = parseInt(parts[1], 10);
  if (isNaN(hours) || isNaN(minutes)) return 0;
  var total = hours * 60 + minutes;
  return negative ? -total : total;
}
function minutesToHHMM(totalMinutes) {
  var mins = Math.round(totalMinutes || 0);
  var negative = mins < 0, abs = Math.abs(mins);
  var h = Math.floor(abs / 60), m = abs % 60;
  var str = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  return negative ? '-' + str : str;
}
var WEEKDAYS_PT = ['domingo','segunda-feira','terca-feira','quarta-feira','quinta-feira','sexta-feira','sabado'];
function parseBrDate(dataStr) {
  if (!dataStr) return { iso: null, weekday: null };
  var parts = dataStr.trim().split('/');
  var d = parts[0], m = parts[1], y = parts[2];
  if (!d || !m || !y) return { iso: null, weekday: null };
  var iso = y.padStart(4,'0') + '-' + m.padStart(2,'0') + '-' + d.padStart(2,'0');
  var dateObj = new Date(Date.UTC(Number(y), Number(m) - 1, Number(d)));
  return { iso: iso, weekday: WEEKDAYS_PT[dateObj.getUTCDay()] };
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function isoToBr(iso) {
  if (!iso) return iso;
  var p = iso.split('-');
  return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : iso;
}
function excedente12hMin(r) {
  var jornada = r.jornada_diaria_min || 0;
  return Math.max(0, jornada - 12 * 60);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

/* ---------- helpers de e-mail interno ---------- */
// O Supabase Auth exige um e-mail. Como o sistema usa "usuário" (sem e-mail
// de verdade), criamos um e-mail interno fixo pra cada usuário: usuario@portoex.local
function usernameToEmail(username) {
  return username.trim().toLowerCase().replace(/\s+/g, '') + '@portoex.local';
}

/* ---------- sessao (login) ---------- */
var CURRENT_USER = null; // { id, username, role, fullName }

async function loadCurrentProfile() {
  var { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  var { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error || !profile) return null;
  return { id: profile.id, username: profile.username, role: profile.role, fullName: profile.full_name };
}

/* ---------- LOGIN ---------- */
var loginWrap = document.getElementById('loginWrap');
var appShell = document.getElementById('appShell');
var loginForm = document.getElementById('loginForm');
var loginError = document.getElementById('loginError');
var pwInput = document.getElementById('password');
var pwToggle = document.getElementById('pwToggle');
var loginBtn = document.getElementById('loginBtn');

pwToggle.addEventListener('click', function() {
  var isPw = pwInput.type === 'password';
  pwInput.type = isPw ? 'text' : 'password';
  pwToggle.textContent = isPw ? 'ocultar' : 'mostrar';
});

var LS_REMEMBER_USER = 'portoex_remember_user_v1';
var savedUser = localStorage.getItem(LS_REMEMBER_USER);
if (savedUser) {
  document.getElementById('username').value = savedUser;
  document.getElementById('remember').checked = true;
}

loginForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  loginError.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Entrando...';

  var username = document.getElementById('username').value.trim();
  var password = pwInput.value;
  var remember = document.getElementById('remember').checked;

  var { data, error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password: password });

  if (error || !data.user) {
    loginError.textContent = 'Usuário ou senha inválidos.';
    loginError.style.display = 'block';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Entrar';
    return;
  }

  if (remember) localStorage.setItem(LS_REMEMBER_USER, username);
  else localStorage.removeItem(LS_REMEMBER_USER);

  var profile = await loadCurrentProfile();
  if (!profile) {
    loginError.textContent = 'Login ok, mas não achei seu perfil. Fale com o administrador.';
    loginError.style.display = 'block';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Entrar';
    return;
  }
  CURRENT_USER = profile;
  enterApp();
  loginBtn.disabled = false;
  loginBtn.textContent = 'Entrar';
});

/* ---------- CADASTRO (primeiro acesso) ---------- */
var signupLink = document.getElementById('signupLink');
var signupForm = document.getElementById('signupForm');
var signupError = document.getElementById('signupError');
var signupBtn = document.getElementById('signupBtn');

if (signupLink) {
  signupLink.addEventListener('click', function(e) {
    e.preventDefault();
    loginForm.classList.add('hidden');
    signupForm.classList.remove('hidden');
    signupLink.classList.add('hidden');
    backToLoginLink.classList.remove('hidden');
  });
}
var backToLoginLink = document.getElementById('backToLoginLink');
if (backToLoginLink) {
  backToLoginLink.addEventListener('click', function(e) {
    e.preventDefault();
    signupForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
    signupLink.classList.remove('hidden');
    backToLoginLink.classList.add('hidden');
  });
}

if (signupForm) {
  signupForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    signupError.style.display = 'none';
    signupBtn.disabled = true;
    signupBtn.textContent = 'Cadastrando...';

    var fullName = document.getElementById('signupFullName').value.trim();
    var username = document.getElementById('signupUsername').value.trim();
    var password = document.getElementById('signupPassword').value;

    if (!fullName || !username || password.length < 6) {
      signupError.textContent = 'Preencha nome, usuário e uma senha com pelo menos 6 caracteres.';
      signupError.style.display = 'block';
      signupBtn.disabled = false;
      signupBtn.textContent = 'Cadastrar';
      return;
    }

    var { data, error } = await sb.auth.signUp({
      email: usernameToEmail(username),
      password: password,
      options: { data: { username: username, full_name: fullName } },
    });

    if (error) {
      signupError.textContent = error.message.indexOf('already') !== -1 || error.message.indexOf('registered') !== -1
        ? 'Já existe um usuário com esse nome.'
        : ('Erro ao cadastrar: ' + error.message);
      signupError.style.display = 'block';
      signupBtn.disabled = false;
      signupBtn.textContent = 'Cadastrar';
      return;
    }

    var profile = await loadCurrentProfile();
    if (profile) {
      CURRENT_USER = profile;
      enterApp();
    } else {
      signupError.textContent = 'Cadastro feito! Faça login normalmente.';
      signupError.style.display = 'block';
      signupForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      signupLink.classList.remove('hidden');
      backToLoginLink.classList.add('hidden');
    }
    signupBtn.disabled = false;
    signupBtn.textContent = 'Cadastrar';
  });
}

async function tryAutoLogin() {
  var { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  var profile = await loadCurrentProfile();
  if (!profile) return false;
  CURRENT_USER = profile;
  enterApp();
  return true;
}

function enterApp() {
  loginWrap.classList.add('hidden');
  appShell.classList.add('visible');
  document.getElementById('userName').textContent = CURRENT_USER.fullName || CURRENT_USER.username;
  document.getElementById('userRole').textContent = CURRENT_USER.role === 'admin' ? 'Administrador' : 'Usuário';
  document.getElementById('navUsuarios').style.display = CURRENT_USER.role === 'admin' ? '' : 'none';
  route('dashboard');
}

document.getElementById('logoutBtn').addEventListener('click', async function() {
  await sb.auth.signOut();
  CURRENT_USER = null;
  appShell.classList.remove('visible');
  loginWrap.classList.remove('hidden');
  pwInput.value = '';
});

document.getElementById('navMenu').addEventListener('click', function(e) {
  var a = e.target.closest('a[data-view]');
  if (!a) return;
  route(a.dataset.view);
});

/* ---------- roteamento simples entre telas ---------- */
var TITLES = { dashboard: 'Dashboard geral', registros: 'Registros / Jornadas', importar: 'Importar CSV', usuarios: 'Usuários' };
var content = document.getElementById('content');
var pageTitle = document.getElementById('pageTitle');
var charts = {};
function destroyCharts() { Object.values(charts).forEach(function(c) { c && c.destroy(); }); charts = {}; }

function route(view) {
  if (view === 'usuarios' && CURRENT_USER.role !== 'admin') view = 'dashboard';
  document.querySelectorAll('#navMenu a').forEach(function(a) { a.classList.toggle('active', a.dataset.view === view); });
  pageTitle.textContent = TITLES[view];
  destroyCharts();
  if (view === 'dashboard') renderDashboard();
  else if (view === 'registros') renderRegistros();
  else if (view === 'importar') renderImportar();
  else if (view === 'usuarios') renderUsuarios();
}

function fmtDateInput(d) { return d.toISOString().slice(0, 10); }
async function getReferenceDate() {
  // Usa a data mais recente dos registros importados como "hoje" de referencia,
  // em vez da data real do computador — assim os presets (dia/mes/ano) sempre
  // batem com os dados que voce importou, nao importa quando voce abrir o sistema.
  var records = await fetchAllRecords();
  if (records.length === 0) return new Date();
  var maxIso = records.reduce(function(m, r) { return r.data_iso > m ? r.data_iso : m; }, records[0].data_iso);
  return new Date(maxIso + 'T00:00:00Z');
}
async function presetRange(preset) {
  if (preset === 'tudo') {
    var records = await fetchAllRecords();
    if (records.length === 0) return { from: '', to: '' };
    var minIso = records.reduce(function(m, r) { return r.data_iso < m ? r.data_iso : m; }, records[0].data_iso);
    var maxIso = records.reduce(function(m, r) { return r.data_iso > m ? r.data_iso : m; }, records[0].data_iso);
    return { from: minIso, to: maxIso };
  }
  var now = await getReferenceDate(), from, to;
  if (preset === 'hoje') { from = to = now; }
  else if (preset === 'mes') { from = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)); to = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0)); }
  else if (preset === 'ano') { from = new Date(Date.UTC(now.getUTCFullYear(), 0, 1)); to = new Date(Date.UTC(now.getUTCFullYear(), 11, 31)); }
  return { from: fmtDateInput(from), to: fmtDateInput(to) };
}

/* ================= DASHBOARD ================= */
async function fetchAllRecords() {
  var { data, error } = await sb.from('records').select('*');
  if (error) { console.error('Erro ao buscar registros:', error); return []; }
  return data || [];
}

async function filterRecords(f) {
  var all = await fetchAllRecords();
  return all.filter(function(r) {
    if (f.from && r.data_iso < f.from) return false;
    if (f.to && r.data_iso > f.to) return false;
    if (f.motorista && r.condutor.toLowerCase().indexOf(f.motorista.toLowerCase()) === -1) return false;
    if (f.cidade && (!r.cidade || r.cidade.toLowerCase().indexOf(f.cidade.toLowerCase()) === -1)) return false;
    if (f.onlyEstourou && !r.estourou_12h) return false;
    if (f.onlySemCidade && r.cidade) return false;
    if (f.onlyInterjornada && !r.interjornada_violada) return false;
    return true;
  });
}

async function renderDashboard() {
  content.innerHTML =
    '<div class="filters">' +
      '<div class="f-field"><label>De</label><input type="date" id="fFrom" /></div>' +
      '<div class="f-field"><label>Até</label><input type="date" id="fTo" /></div>' +
      '<div class="f-field"><label>Motorista</label><input type="text" id="fMotorista" placeholder="Nome..." /></div>' +
      '<div class="f-field"><label>Cidade</label><input type="text" id="fCidade" placeholder="Cidade..." /></div>' +
      '<div class="f-field"><label>Período rápido</label><div class="preset-row" id="presetRow">' +
        '<button class="btn-sm active" data-preset="tudo">Tudo</button>' +
        '<button class="btn-sm" data-preset="hoje">Dia</button>' +
        '<button class="btn-sm" data-preset="mes">Mês</button>' +
        '<button class="btn-sm" data-preset="ano">Ano</button>' +
      '</div></div>' +
      '<button class="btn-sm primary" id="applyFilters">Filtrar</button>' +
    '</div>' +
    '<div class="kpi-grid" id="kpiGrid">' +
      '<div class="kpi-card"><div class="label">Total de dias</div><div class="value">-</div></div>' +
      '<div class="kpi-card"><div class="label">Motoristas</div><div class="value">-</div></div>' +
      '<div class="kpi-card"><div class="label">Horas normais</div><div class="value">-</div></div>' +
      '<div class="kpi-card"><div class="label">Horas extras</div><div class="value">-</div></div>' +
      '<div class="kpi-card"><div class="label">Dias com hora extra</div><div class="value">-</div></div>' +
      '<div class="kpi-card" id="kpiEstourou" style="cursor:pointer;" title="Clique para ver a lista"><div class="label">Dias que estourou 12h</div><div class="value">-</div></div>' +
      '<div class="kpi-card"><div class="label">Acúmulo acima de 12h</div><div class="value">-</div></div>' +
      '<div class="kpi-card" id="kpiInterjornada" style="cursor:pointer;" title="Clique para ver a lista"><div class="label">Interjornadas violadas (&lt;11h)</div><div class="value">-</div></div>' +
    '</div>' +
    '<div class="charts-grid">' +
      '<div class="panel"><h3>Horas extras por motorista (top 20)</h3><canvas id="chartMotorista" height="220"></canvas></div>' +
      '<div class="panel"><h3>Cidades com estouro de 12h (dias)</h3><canvas id="chartCidade" height="220"></canvas></div>' +
    '</div>' +
    '<div class="charts-grid">' +
      '<div class="panel"><h3>Quantidade de dias que estourou 12h por motorista (top 20)</h3><canvas id="chartExcedente" height="220"></canvas></div>' +
      '<div class="panel"><h3>Evolução de horas extras por dia</h3><canvas id="chartDia" height="220"></canvas></div>' +
    '</div>' +
    '<div class="panel mt-16"><h3>Estouros de 12h por data</h3><div style="height:150px;"><canvas id="chartEstourosPorData"></canvas></div></div>' +
    '<div class="panel mt-16"><h3>Mapa: cidades com estouro de 12h</h3><div id="mapaCidades"></div></div>' +
    '<div class="charts-grid mt-16">' +
      '<div class="panel"><h3 id="tituloInterjornadaMotorista">Interjornadas violadas por motorista</h3><canvas id="chartInterjornada" height="220"></canvas></div>' +
      '<div class="panel"><h3>Interjornadas violadas por data</h3><canvas id="chartInterjornadaPorData" height="220"></canvas></div>' +
    '</div>';

  var r = await presetRange('tudo');
  document.getElementById('fFrom').value = r.from;
  document.getElementById('fTo').value = r.to;

  document.querySelectorAll('#presetRow button').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      document.querySelectorAll('#presetRow button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var rr = await presetRange(btn.dataset.preset);
      document.getElementById('fFrom').value = rr.from;
      document.getElementById('fTo').value = rr.to;
      loadDashboard();
    });
  });
  document.getElementById('applyFilters').addEventListener('click', loadDashboard);
  document.getElementById('kpiEstourou').addEventListener('click', function() {
    REG_PENDING_FILTER = { onlyEstourou: true };
    route('registros');
  });
  document.getElementById('kpiInterjornada').addEventListener('click', function() {
    REG_PENDING_FILTER = { onlyInterjornada: true };
    route('registros');
  });
  loadDashboard();
}

async function loadDashboard() {
  var f = {
    from: document.getElementById('fFrom').value,
    to: document.getElementById('fTo').value,
    motorista: document.getElementById('fMotorista').value.trim(),
    cidade: document.getElementById('fCidade').value.trim(),
  };
  var rows = await filterRecords(f);

  var motoristasSet = {}, horasNormais = 0, horasExtras = 0, diasComExtra = 0, diasEstourou = 0, excedenteTotal = 0, interjornadasVioladas = 0;
  var porMotorista = {}, porCidade = {}, porDia = {}, porMotoristaInterjornada = {};
  var estourosEventos = []; // {motorista, data, cidade} - para o grafico de dispersao
  var interjornadaEventos = [];

  rows.forEach(function(r) {
    motoristasSet[r.condutor] = true;
    horasNormais += r.horas_normais_min;
    horasExtras += r.horas_extras_min;
    if (r.horas_extras_min > 0) diasComExtra++;
    var exced = excedente12hMin(r);
    if (r.estourou_12h) {
      diasEstourou++;
      estourosEventos.push({ motorista: r.condutor, data: r.data_iso, cidade: r.cidade || 'Não informado' });
    }
    excedenteTotal += exced;

    if (r.interjornada_violada) {
      interjornadasVioladas++;
      interjornadaEventos.push({ motorista: r.condutor, data: r.data_iso, valor: r.interjornada_min });
      if (!porMotoristaInterjornada[r.condutor]) porMotoristaInterjornada[r.condutor] = 0;
      porMotoristaInterjornada[r.condutor]++;
    }

    if (!porMotorista[r.condutor]) porMotorista[r.condutor] = { dias: 0, extras: 0, estourou: 0, excedente: 0 };
    porMotorista[r.condutor].dias++;
    porMotorista[r.condutor].extras += r.horas_extras_min;
    porMotorista[r.condutor].excedente += exced;
    if (r.estourou_12h) porMotorista[r.condutor].estourou++;

    var cid = r.cidade || 'Não informado';
    if (!porCidade[cid]) porCidade[cid] = { dias: 0, diasEstourou: 0, extras: 0, excedente: 0 };
    porCidade[cid].dias++;
    porCidade[cid].extras += r.horas_extras_min;
    if (r.estourou_12h) {
      porCidade[cid].diasEstourou++;
      porCidade[cid].excedente += exced;
    }

    if (!porDia[r.data_iso]) porDia[r.data_iso] = { extras: 0, normais: 0 };
    porDia[r.data_iso].extras += r.horas_extras_min;
    porDia[r.data_iso].normais += r.horas_normais_min;
  });

  var cards = document.querySelectorAll('#kpiGrid .kpi-card .value');
  cards[0].textContent = rows.length;
  cards[1].textContent = Object.keys(motoristasSet).length;
  cards[2].textContent = minutesToHHMM(horasNormais);
  cards[3].textContent = minutesToHHMM(horasExtras);
  cards[4].textContent = diasComExtra;
  cards[5].textContent = diasEstourou;
  cards[6].textContent = minutesToHHMM(excedenteTotal);
  cards[7].textContent = interjornadasVioladas;

  var motoristaArr = Object.keys(porMotorista).map(function(k) { return { nome: k, extras: porMotorista[k].extras }; })
    .sort(function(a, b) { return b.extras - a.extras; }).slice(0, 20);
  var cidadeArr = Object.keys(porCidade).map(function(k) { return { nome: k, diasEstourou: porCidade[k].diasEstourou }; })
    .filter(function(r) { return r.diasEstourou > 0; })
    .sort(function(a, b) { return b.diasEstourou - a.diasEstourou; }).slice(0, 20);
  var excedenteArr = Object.keys(porMotorista).map(function(k) { return { nome: k, qtd: porMotorista[k].estourou }; })
    .filter(function(r) { return r.qtd > 0; })
    .sort(function(a, b) { return b.qtd - a.qtd; }).slice(0, 20);
  var diaArr = Object.keys(porDia).sort().map(function(k) { return { data: k, extras: porDia[k].extras }; });
  var interjornadaArr = Object.keys(porMotoristaInterjornada).map(function(k) { return { nome: k, qtd: porMotoristaInterjornada[k] }; })
    .sort(function(a, b) { return b.qtd - a.qtd; }).slice(0, 20);

  destroyCharts();
  charts.motorista = new Chart(document.getElementById('chartMotorista'), {
    type: 'bar',
    data: { labels: motoristaArr.map(function(r){return r.nome;}), datasets: [{ label: 'Horas extras', data: motoristaArr.map(function(r){return r.extras;}), backgroundColor: '#1e5ea8' }] },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx) { return 'Horas extras: ' + minutesToHHMM(ctx.parsed.x); } } },
      },
      scales: { x: { ticks: { callback: function(v){ return Math.round(v/60)+'h'; } } } },
    },
  });
  charts.cidade = new Chart(document.getElementById('chartCidade'), {
    type: 'bar',
    data: { labels: cidadeArr.map(function(r){return r.nome;}), datasets: [{ label: 'Dias que estourou 12h', data: cidadeArr.map(function(r){return r.diasEstourou;}), backgroundColor: '#c0392b' }] },
    options: { plugins: { legend: { display: false } } },
  });
  charts.excedente = new Chart(document.getElementById('chartExcedente'), {
    type: 'bar',
    data: { labels: excedenteArr.map(function(r){return r.nome;}), datasets: [{ label: 'Dias que estourou 12h', data: excedenteArr.map(function(r){return r.qtd;}), backgroundColor: '#c0392b' }] },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx) { return ctx.parsed.x + (ctx.parsed.x === 1 ? ' dia' : ' dias') + ' com estouro de 12h'; } } },
      },
      scales: { x: { ticks: { stepSize: 1, precision: 0 } } },
    },
  });
  charts.dia = new Chart(document.getElementById('chartDia'), {
    type: 'line',
    data: { labels: diaArr.map(function(r){return isoToBr(r.data);}), datasets: [{ label: 'Horas extras', data: diaArr.map(function(r){return r.extras;}), borderColor: '#1e5ea8', backgroundColor: 'rgba(30,94,168,0.15)', fill: true, tension: 0.25 }] },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx) { return 'Horas extras: ' + minutesToHHMM(ctx.parsed.y); } } },
      },
      scales: { y: { ticks: { callback: function(v){ return Math.round(v/60)+'h'; } } } },
    },
  });

  // Barras por data: quantos estouros de 12h aconteceram em cada dia,
  // com os nomes dos motoristas aparecendo ao passar o mouse.
  var porDataEstouro = {};
  estourosEventos.forEach(function(e) {
    var br = isoToBr(e.data);
    if (!porDataEstouro[br]) porDataEstouro[br] = [];
    porDataEstouro[br].push(e.motorista);
  });
  var datasComEstouro = Object.keys(porDataEstouro).sort(function(a, b) {
    function toIso(d) { var p = d.split('/'); return p[2] + '-' + p[1] + '-' + p[0]; }
    return toIso(a).localeCompare(toIso(b));
  });
  charts.estourosPorData = new Chart(document.getElementById('chartEstourosPorData'), {
    type: 'bar',
    data: {
      labels: datasComEstouro,
      datasets: [{
        label: 'Estouros de 12h',
        data: datasComEstouro.map(function(d) { return porDataEstouro[d].length; }),
        backgroundColor: '#c0392b',
      }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: function(ctx) { return ctx.parsed.y + (ctx.parsed.y === 1 ? ' estouro' : ' estouros'); },
          afterLabel: function(ctx) {
            var nomes = porDataEstouro[ctx.label] || [];
            return nomes.map(function(n) { return '• ' + n; });
          },
        } },
      },
      scales: { y: { ticks: { stepSize: 1, precision: 0 } } },
    },
  });

  // Interjornada por motorista (quantidade de dias com descanso < 11h)
  document.getElementById('tituloInterjornadaMotorista').textContent =
    'Interjornadas violadas por motorista (' + interjornadaArr.length + (interjornadaArr.length === 1 ? ' motorista' : ' motoristas') + ')';
  charts.interjornada = new Chart(document.getElementById('chartInterjornada'), {
    type: 'bar',
    data: { labels: interjornadaArr.map(function(r){return r.nome;}), datasets: [{ label: 'Interjornadas violadas', data: interjornadaArr.map(function(r){return r.qtd;}), backgroundColor: '#b7791f' }] },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx) { return ctx.parsed.x + (ctx.parsed.x === 1 ? ' dia' : ' dias') + ' com descanso < 11h'; } } },
      },
      scales: { x: { ticks: { stepSize: 1, precision: 0 } } },
    },
  });

  // Interjornada por data (com os nomes dos motoristas no tooltip)
  var porDataInterjornada = {};
  interjornadaEventos.forEach(function(e) {
    var br = isoToBr(e.data);
    if (!porDataInterjornada[br]) porDataInterjornada[br] = [];
    porDataInterjornada[br].push(e.motorista + ' (' + minutesToHHMM(e.valor) + ')');
  });
  var datasComInterjornada = Object.keys(porDataInterjornada).sort(function(a, b) {
    function toIso(d) { var p = d.split('/'); return p[2] + '-' + p[1] + '-' + p[0]; }
    return toIso(a).localeCompare(toIso(b));
  });
  charts.interjornadaPorData = new Chart(document.getElementById('chartInterjornadaPorData'), {
    type: 'bar',
    data: {
      labels: datasComInterjornada,
      datasets: [{
        label: 'Interjornadas violadas',
        data: datasComInterjornada.map(function(d) { return porDataInterjornada[d].length; }),
        backgroundColor: '#b7791f',
      }],
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: function(ctx) { return ctx.parsed.y + (ctx.parsed.y === 1 ? ' interjornada violada' : ' interjornadas violadas'); },
          afterLabel: function(ctx) {
            var nomes = porDataInterjornada[ctx.label] || [];
            return nomes.map(function(n) { return '• ' + n; });
          },
        } },
      },
      scales: { y: { ticks: { stepSize: 1, precision: 0 } } },
    },
  });

  renderMapaCidades(porCidade);
}

function normalizeCityName(s) {
  var v = (s || '').toString().trim().toLowerCase();

  v = v.replace(/[\s,/-]+[a-z]{2}\s*$/i, '');
  v = v.trim().replace(/\s+/g, ' ');
  return v.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // remove acentos

    '<p class="text-muted" style="font-size:11px;margin-top:4px;">Use a roda do mouse (ou os botões) para dar zoom, e arraste para mover o mapa. Passe o mouse num ponto para ver os detalhes, clique para filtrar a lista de registros dessa cidade.</p>';

  var wrap = document.getElementById('mapaWrap');
  var svgEl = document.getElementById('mapaSvg');
  var tooltip = document.getElementById('mapaTooltip');

  // ---------- zoom / pan (viewBox manual, sem depender de nenhuma lib externa) ----------
  var containerRatio = MAPA_WIDTH / MAPA_HEIGHT;
  var xs = found.map(function(f){return f.x;}), ys = found.map(function(f){return f.y;});
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var padX = Math.max(50, (maxX - minX) * 0.35);
  var padY = Math.max(50, (maxY - minY) * 0.35);
  var fitX = minX - padX, fitY = minY - padY;
  var fitW = Math.max((maxX - minX) + padX * 2, 110);
  var fitH = Math.max((maxY - minY) + padY * 2, 110 / containerRatio);
  // ajusta a proporcao da caixa de enquadramento para bater com a proporcao do svg (sem distorcer)
  if (fitW / fitH < containerRatio) {
    var targetW = fitH * containerRatio;
    fitX -= (targetW - fitW) / 2; fitW = targetW;
  } else {
    var targetH = fitW / containerRatio;
    fitY -= (targetH - fitH) / 2; fitH = targetH;
  }

  var MIN_W = 45; // zoom maximo (caixa mais estreita = mais zoom)
  var MAX_W = MAPA_WIDTH; // zoom minimo = regiao toda

  var vb = { x: fitX, y: fitY, w: fitW, h: fitH };
  var fitVb = { x: fitX, y: fitY, w: fitW, h: fitH };

  var circleEls = svgEl.querySelectorAll('.map-marker');
  var labelEls = svgEl.querySelectorAll('.map-label');
  var leaderEls = svgEl.querySelectorAll('.map-leader');

  // Conforme da zoom (vb.w diminui), os marcadores e textos encolhem na mesma
  // proporcao — assim, em pixels na tela, eles ficam com tamanho quase constante,
  // e as cidades "abrem espaco" entre si em vez de crescerem junto com o zoom.
  // A referencia (escala 1) e a visao inicial (jah enquadrada nas cidades).
  // Alem disso, quando dois rótulos de cidades diferentes ficariam um em cima do
  // outro, o texto é deslocado pra cima (com uma linha fina ligando ele ao ponto).
  function updateMarkerSizes() {
    var scale = vb.w / fitVb.w;
    scale = Math.max(0.22, Math.min(2.2, scale));

    var placedBoxes = [];
    var order = found.map(function(f, i) { return i; }).sort(function(a, b) { return found[a].y - found[b].y; });

    order.forEach(function(i) {
      var f = found[i];
      var rBase = parseFloat(circleEls[i].dataset.r);
      var r = Math.max(2.5, rBase * scale);
      circleEls[i].setAttribute('r', r.toFixed(2));

      var fontSize = Math.max(6, 11 * scale);
      labelEls[i].setAttribute('font-size', fontSize.toFixed(1));

      var textWidth = Math.max(f.nome.length * fontSize * 0.56, fontSize * 2);
      var baseY = f.y - r - fontSize * 0.45;
      var y = baseY;
      var pad = fontSize * 0.25;

      for (var attempt = 0; attempt < 10; attempt++) {
        var box = { x1: f.x - textWidth / 2 - pad, x2: f.x + textWidth / 2 + pad, y1: y - fontSize - pad, y2: y + pad };
        var collide = placedBoxes.some(function(p) {
          return !(box.x2 < p.x1 || box.x1 > p.x2 || box.y2 < p.y1 || box.y1 > p.y2);
        });
        if (!collide) break;
        y -= fontSize * 1.05;
      }

      placedBoxes.push({ x1: f.x - textWidth / 2 - pad, x2: f.x + textWidth / 2 + pad, y1: y - fontSize - pad, y2: y + pad });
      labelEls[i].setAttribute('y', y.toFixed(1));

      var displaced = Math.abs(y - baseY) > fontSize * 0.6;
      var leader = leaderEls[i];
      if (displaced) {
        leader.setAttribute('x1', f.x.toFixed(1));
        leader.setAttribute('y1', (f.y - r).toFixed(1));
        leader.setAttribute('x2', f.x.toFixed(1));
        leader.setAttribute('y2', (y + fontSize * 0.15).toFixed(1));
        leader.setAttribute('stroke-opacity', '0.55');
      } else {
        leader.setAttribute('stroke-opacity', '0');
      }
    });
  }

  function applyViewBox() {
    svgEl.setAttribute('viewBox', vb.x.toFixed(1) + ' ' + vb.y.toFixed(1) + ' ' + vb.w.toFixed(1) + ' ' + vb.h.toFixed(1));
    updateMarkerSizes();
  }
  applyViewBox();

  function screenToSvg(clientX, clientY) {
    var rect = svgEl.getBoundingClientRect();
    return {
      x: vb.x + (clientX - rect.left) / rect.width * vb.w,
      y: vb.y + (clientY - rect.top) / rect.height * vb.h,
    };
  }

  function zoomAt(factor, svgPoint) {
    var newW = Math.min(MAX_W, Math.max(MIN_W, vb.w * factor));
    var ratio = newW / vb.w;
    var newH = vb.h * ratio;
    vb.x = svgPoint.x - (svgPoint.x - vb.x) * ratio;
    vb.y = svgPoint.y - (svgPoint.y - vb.y) * ratio;
    vb.w = newW; vb.h = newH;
    applyViewBox();
  }

  svgEl.addEventListener('wheel', function(e) {
    e.preventDefault();
    var pt = screenToSvg(e.clientX, e.clientY);
    zoomAt(e.deltaY > 0 ? 1.18 : 1 / 1.18, pt);
  }, { passive: false });

  document.getElementById('mapaZoomIn').addEventListener('click', function() {
    zoomAt(1 / 1.4, { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  });
  document.getElementById('mapaZoomOut').addEventListener('click', function() {
    zoomAt(1.4, { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  });
  document.getElementById('mapaZoomReset').addEventListener('click', function() {
    vb = { x: fitVb.x, y: fitVb.y, w: fitVb.w, h: fitVb.h };
    applyViewBox();
  });

  // arrastar para mover (pan) — distingue de um clique num marcador
  var dragging = false, dragMoved = false, dragStart = null, vbStart = null;

  svgEl.addEventListener('mousedown', function(e) {
    dragging = true; dragMoved = false;
    dragStart = { x: e.clientX, y: e.clientY };
    vbStart = { x: vb.x, y: vb.y };
    svgEl.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var rect = svgEl.getBoundingClientRect();
    var dxPx = e.clientX - dragStart.x, dyPx = e.clientY - dragStart.y;
    if (Math.abs(dxPx) > 3 || Math.abs(dyPx) > 3) dragMoved = true;
    if (!dragMoved) return;
    vb.x = vbStart.x - dxPx / rect.width * vb.w;
    vb.y = vbStart.y - dyPx / rect.height * vb.h;
    applyViewBox();
  });
  window.addEventListener('mouseup', function() {
    if (dragging) svgEl.style.cursor = 'grab';
    dragging = false;
  });
  // impede que o "clique" do fim do arrasto dispare a navegacao do marcador
  svgEl.addEventListener('click', function(e) {
    if (dragMoved) { e.stopPropagation(); dragMoved = false; }
  }, true);

  function showTooltip(f, clientX, clientY) {
    var wrapRect = wrap.getBoundingClientRect();
    tooltip.innerHTML = '<b>' + escapeHtml(f.nome) + '</b><br/>' + f.diasEstourou + (f.diasEstourou === 1 ? ' dia' : ' dias') + ' com estouro de 12h<br/><span class="hint">clique para ver os registros</span>';
    tooltip.style.left = (clientX - wrapRect.left) + 'px';
    tooltip.style.top = (clientY - wrapRect.top) + 'px';
    tooltip.classList.add('visible');
  }
  function hideTooltip() { tooltip.classList.remove('visible'); }

  svgEl.querySelectorAll('.map-marker').forEach(function(circle) {
    var f = found[Number(circle.dataset.idx)];
    circle.addEventListener('mouseenter', function(e) { showTooltip(f, e.clientX, e.clientY); });
    circle.addEventListener('mousemove', function(e) { showTooltip(f, e.clientX, e.clientY); });
    circle.addEventListener('mouseleave', hideTooltip);
    circle.addEventListener('click', function() {
      if (dragMoved) return;
      REG_PENDING_FILTER = { onlyEstourou: true, cidade: f.nome };
      route('registros');
    });
    // toque em telas mobile: primeiro toque mostra tooltip, mantem comportamento de clique tambem
    circle.addEventListener('touchstart', function(e) {
      var touch = e.touches[0];
      showTooltip(f, touch.clientX, touch.clientY);
    }, { passive: true });
  });
}

    '</div></div></div>';

  document.getElementById('rApply').addEventListener('click', function() { regState.page = 1; loadRegistros(); });

  document.getElementById('rOnlySemCidade').addEventListener('change', function() { regState.page = 1; loadRegistros(); });
  document.getElementById('rOnlyInterjornada').addEventListener('change', function() { regState.page = 1; loadRegistros(); });
  document.getElementById('pagPrev').addEventListener('click', function() { if (regState.page > 1) { regState.page--; loadRegistros(); } });
  document.getElementById('pagNext').addEventListener('click', function() { regState.page++; loadRegistros(); });

function regFilters() {
  return {
    from: document.getElementById('rFrom').value,
    to: document.getElementById('rTo').value,
    motorista: document.getElementById('rMotorista').value.trim(),
    cidade: document.getElementById('rCidade').value.trim(),
    onlyEstourou: document.getElementById('rOnlyEstourou').checked,
    onlySemCidade: document.getElementById('rOnlySemCidade').checked,
    onlyInterjornada: document.getElementById('rOnlyInterjornada').checked,
  };
}

async function loadRegistros() {
  var all = (await filterRecords(regFilters())).sort(function(a, b) {
    if (a.data_iso === b.data_iso) return a.condutor.localeCompare(b.condutor);
    return b.data_iso.localeCompare(a.data_iso);
  });
  var total = all.length;
  var start = (regState.page - 1) * regState.pageSize;
  var pageRows = all.slice(start, start + regState.pageSize);

  var tbody = document.getElementById('rTbody');
  if (pageRows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="text-muted" style="padding:20px;">Nenhum registro encontrado. Importe um CSV na aba "Importar CSV".</td></tr>';
  } else {
    tbody.innerHTML = pageRows.map(rowHtml).join('');
  }
  document.getElementById('rCount').textContent = total + ' registro(s)';
  var totalPages = Math.max(1, Math.ceil(total / regState.pageSize));
  document.getElementById('pagInfo').textContent = 'Página ' + regState.page + ' de ' + totalPages;

  tbody.querySelectorAll('[data-edit]').forEach(function(el) { el.addEventListener('change', onInlineEdit); });
}

function rowHtml(r) {
  var jornadaExibir = r.jornada_diaria_min;
  var interjornadaTxt = r.interjornada_min != null ? minutesToHHMM(r.interjornada_min) : '—';
  var interjornadaBadge = r.interjornada_min == null
    ? '<span class="text-muted">—</span>'
    : (r.interjornada_violada ? '<span class="badge-sim">' + interjornadaTxt + '</span>' : interjornadaTxt);
  return '<tr data-id="' + r.id + '">' +
    '<td>' + r.data + '</td>' +
    '<td>' + escapeHtml(r.condutor) + '</td>' +
    '<td><input class="editable-input" data-edit="placa" data-id="' + r.id + '" value="' + escapeHtml(r.placa || '') + '" placeholder="—" /></td>' +
    '<td>' + minutesToHHMM(jornadaExibir) + '</td>' +
    '<td><input class="editable-input" data-edit="cidade" data-id="' + r.id + '" value="' + escapeHtml(r.cidade || '') + '" placeholder="—" /></td>' +
    '<td><input class="editable-input" data-edit="causador" data-id="' + r.id + '" value="' + escapeHtml(r.causador || '') + '" placeholder="—" /></td>' +
    '<td>' + minutesToHHMM(r.horas_normais_min) + '</td>' +
    '<td>' + minutesToHHMM(r.horas_extras_min) + '</td>' +
    '<td>' + (r.estourou_12h ? '<span class="badge-sim">Sim (+' + minutesToHHMM(excedente12hMin(r)) + ')</span>' : '<span class="badge-nao">Não</span>') + '</td>' +
    '<td>' + interjornadaBadge + '</td>' +
    '<td>' + capitalize(r.dia_semana || '') + '</td>' +
  '</tr>';
}

async function onInlineEdit(e) {
  var el = e.target, id = Number(el.dataset.id), field = el.dataset.edit;
  var payload = {};
  payload[field] = el.value;
  payload.updated_at = new Date().toISOString();
  var { error } = await sb.from('records').update(payload).eq('id', id);
  if (error) { alert('Erro ao salvar: ' + error.message); }
}

async function exportData(kind) {
  var rows = (await filterRecords(regFilters())).sort(function(a, b) { return a.data_iso.localeCompare(b.data_iso); });
  if (rows.length === 0) { alert('Nenhum registro para exportar com esse filtro.'); return; }

  var data = rows.map(function(r) {
    return {
      'Motorista': r.condutor, 'Matricula': r.matricula, 'Data': r.data, 'Dia da Semana': r.dia_semana,
      'Tipo': r.tipo, 'Cidade': r.cidade || '', 'Placa': r.placa || '', 'Causador': r.causador || '',
      'Horas Normais': minutesToHHMM(r.horas_normais_min), 'Horas Extras': minutesToHHMM(r.horas_extras_min),
      'Jornada Diaria (usada p/ estouro 12h)': minutesToHHMM(r.jornada_diaria_min), 'Jornada Total (com intervalo)': minutesToHHMM(r.jornada_total_min != null ? r.jornada_total_min : r.jornada_diaria_min), 'Estourou 12h?': r.estourou_12h ? 'Sim' : 'Nao',
      'Acumulo acima de 12h': minutesToHHMM(excedente12hMin(r)),
      'Interjornada (descanso)': r.interjornada_min != null ? minutesToHHMM(r.interjornada_min) : '',
      'Interjornada violada (<11h)?': r.interjornada_min == null ? '' : (r.interjornada_violada ? 'Sim' : 'Nao'),
      'Observacao': r.observacao || '',
    };
  });

  if (kind === 'csv') {
    var headers = Object.keys(data[0]);
    var lines = [headers.join(';')];
    data.forEach(function(row) {
      lines.push(headers.map(function(h) { return '"' + String(row[h]).replace(/"/g, '""') + '"'; }).join(';'));
    });
    var csv = '\uFEFF' + lines.join('\r\n');
    downloadBlob(csv, 'portoex_export_' + Date.now() + '.csv', 'text/csv;charset=utf-8');
  } else {
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Jornadas');
    XLSX.writeFile(wb, 'portoex_export_' + Date.now() + '.xlsx');
  }
}

function downloadBlob(content, filename, mime) {
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= IMPORTAR ================= */
var COLS = {
  condutor: 'Condutor', matricula: 'Matrícula', data: 'Data', tipo: 'Tipo',
  horasNormaisDiurnas: 'Horas Normais Diurnas', horasNormaisNoturnas: 'Horas Normais Noturnas',
  horasExtraDiariaDiurna: 'Horas Extra Diária Diurna', horasExtraDiariaNoturna: 'Horas Extra Diária Noturna',
  horasExtraSemanalDiurna: 'Horas Extra Semanal Diurna', horasExtraSemanalNoturna: 'Horas Extra Semanal Noturna',
  jornadaNormalDiaria: 'Jornada Normal Diária', jornadaDiaria: 'Jornada Diária',
  jornadaTotal: 'Jornada Total', descansoDiario: 'Descanso Diário',
  soma50: 'Soma de Horas Extras 50% Diurna, Noturna e Hora Reduzida',
  soma80: 'Soma de Horas Extras 80% Diurna, Noturna e Hora Reduzida',
  soma100: 'Soma de Horas Extras 100% Diurna, Noturna e Hora Reduzida',
};

function parseAtsRows(rows) {
  var results = [], errors = [];
  rows.forEach(function(row, idx) {
    var condutor = (row[COLS.condutor] || '').trim();
    var dataStr = (row[COLS.data] || '').trim();
    if (!condutor || !dataStr) { errors.push('Linha ' + (idx+2) + ': sem Condutor ou Data.'); return; }
    var pd = parseBrDate(dataStr);
    if (!pd.iso) { errors.push('Linha ' + (idx+2) + ': data invalida "' + dataStr + '".'); return; }

    var normaisDiurnas = hhmmToMinutes(row[COLS.horasNormaisDiurnas]);
    var normaisNoturnas = hhmmToMinutes(row[COLS.horasNormaisNoturnas]);
    var jornadaNormal = hhmmToMinutes(row[COLS.jornadaNormalDiaria]);
    var jornadaDiaria = hhmmToMinutes(row[COLS.jornadaDiaria]);

    // Horas extras = mesma conta que a tela "Gestão de Total Extras" do proprio ATS
    // usa (validado batendo motorista a motorista com o relatorio oficial): soma das
    // colunas "Soma de Horas Extras 50/80/100% Diurna, Noturna e Hora Reduzida".
    // (Antes usavamos "Horas Extra Diária/Semanal", que é o excedente bruto e fica
    // mais alto do que o valor oficial pago/computado pelo ATS.)
    var soma50 = hhmmToMinutes(row[COLS.soma50]);
    var soma80 = hhmmToMinutes(row[COLS.soma80]);
    var soma100 = hhmmToMinutes(row[COLS.soma100]);

    // "Jornada Total" = Jornada Diária + intervalo/refeição. E' esse valor que deve
    // ser usado pra checar o estouro de 12h, pois o intervalo entra na conta.
    var jornadaTotalRaw = (row[COLS.jornadaTotal] || '').trim();
    var jornadaTotal = jornadaTotalRaw ? hhmmToMinutes(jornadaTotalRaw) : jornadaDiaria;

    // "Descanso Diário" = tempo de interjornada (descanso entre o fim de um dia de
    // trabalho e o inicio do proximo). Fica em branco quando nao ha o que calcular
    // (ex: primeiro dia do motorista na base, folga, etc.) - nesse caso nao entra
    // na checagem de violacao das 11h (Art. 66 CLT).
    var descansoRaw = (row[COLS.descansoDiario] || '').trim();
    var interjornadaMin = descansoRaw ? hhmmToMinutes(descansoRaw) : null;

    results.push({
      condutor: condutor,
      matricula: (row[COLS.matricula] || '').trim(),
      data: dataStr,
      data_iso: pd.iso,
      dia_semana: pd.weekday,
      tipo: (row[COLS.tipo] || '').trim(),
      horas_normais_min: normaisDiurnas + normaisNoturnas,
      horas_extras_min: soma50 + soma80 + soma100,
      jornada_normal_min: jornadaNormal,
      jornada_diaria_min: jornadaDiaria,
      jornada_total_min: jornadaTotal,
      estourou_12h: jornadaDiaria > 12 * 60,
      interjornada_min: interjornadaMin,
      interjornada_violada: interjornadaMin !== null && interjornadaMin < 11 * 60,
    });
  });
  return { records: results, errors: errors };
}

async function upsertRecords(parsedRecords, filename) {
  if (parsedRecords.length === 0) return { total: 0, novos: 0, atualizados: 0, removidos: 0 };

  var minIso = parsedRecords.reduce(function(m, r) { return r.data_iso < m ? r.data_iso : m; }, parsedRecords[0].data_iso);
  var maxIso = parsedRecords.reduce(function(m, r) { return r.data_iso > m ? r.data_iso : m; }, parsedRecords[0].data_iso);

  // Busca o que já existe no banco dentro do período coberto pelo arquivo, só
  // pra saber o que é novo/atualizado/orfão (nao inclui cidade/placa/etc aqui
  // de proposito - o upsert abaixo nao toca nessas colunas, entao elas ficam
  // preservadas automaticamente pro Postgres).
  var { data: existing, error: exErr } = await sb
    .from('records')
    .select('id,condutor,matricula,data')
    .gte('data_iso', minIso)
    .lte('data_iso', maxIso);
  if (exErr) { throw new Error('Erro ao consultar registros existentes: ' + exErr.message); }

  var existingKeys = {};
  (existing || []).forEach(function(r) { existingKeys[r.condutor + '|' + r.matricula + '|' + r.data] = r.id; });

  var keysNoArquivoNovo = {};
  var novos = 0, atualizados = 0;
  parsedRecords.forEach(function(pr) {
    var key = pr.condutor + '|' + pr.matricula + '|' + pr.data;
    keysNoArquivoNovo[key] = true;
    if (existingKeys.hasOwnProperty(key)) atualizados++; else novos++;
  });

  var payload = parsedRecords.map(function(pr) {
    return {
      condutor: pr.condutor, matricula: pr.matricula, data: pr.data, data_iso: pr.data_iso,
      dia_semana: pr.dia_semana, tipo: pr.tipo,
      horas_normais_min: pr.horas_normais_min, horas_extras_min: pr.horas_extras_min,
      jornada_normal_min: pr.jornada_normal_min, jornada_diaria_min: pr.jornada_diaria_min,
      jornada_total_min: pr.jornada_total_min, estourou_12h: pr.estourou_12h,
      interjornada_min: pr.interjornada_min, interjornada_violada: pr.interjornada_violada,
      updated_at: new Date().toISOString(),
    };
  });

  // Envia em lotes de 200 (limite prudente por requisição)
  for (var i = 0; i < payload.length; i += 200) {
    var lote = payload.slice(i, i + 200);
    var { error: upErr } = await sb.from('records').upsert(lote, { onConflict: 'condutor,matricula,data' });
    if (upErr) { throw new Error('Erro ao importar: ' + upErr.message); }
  }

  // Sincroniza o período coberto pelo arquivo importado: remove registros que
  // ficaram "orfãos" — datas dentro do intervalo do novo arquivo que existiam
  // de uma importação anterior mas não vieram mais nesse CSV (por exemplo,
  // porque o ATS corrigiu/removeu aquela linha). Sem isso, valores antigos e
  // já corrigidos ficavam acumulando e inflando os totais.
  var orphanIds = (existing || [])
    .filter(function(r) { return !keysNoArquivoNovo[r.condutor + '|' + r.matricula + '|' + r.data]; })
    .map(function(r) { return r.id; });
  var removidos = 0;
  if (orphanIds.length > 0) {
    var { error: delErr } = await sb.from('records').delete().in('id', orphanIds);
    if (!delErr) removidos = orphanIds.length;
  }

  await sb.from('imports').insert({
    filename: filename, imported_by_username: CURRENT_USER.username,
    total: parsedRecords.length, novos: novos, atualizados: atualizados, removidos: removidos,
  });

  return { total: parsedRecords.length, novos: novos, atualizados: atualizados, removidos: removidos };
}

function renderImportar() {
  content.innerHTML =
    '<div class="panel" style="max-width:640px;">' +
      '<h3>Importar relatório ATS (.csv)</h3>' +
      '<p class="text-muted" style="font-size:13px;">Envie o arquivo exportado do ATS (separado por ponto e vírgula). O sistema calcula automaticamente horas normais, horas extras e jornada diária de cada motorista. Registros já existentes (mesmo motorista + mesma data) são atualizados, sem duplicar.</p>' +
      '<div class="dropzone" id="dropzone"><div><strong>Clique para escolher o arquivo</strong> ou arraste aqui</div><div class="text-muted" style="margin-top:6px;font-size:12px;">.csv exportado do ATS</div></div>' +
      '<input type="file" id="fileInput" accept=".csv" class="hidden" />' +
      '<div id="importResult"></div>' +
    '</div>' +
    '<div class="panel mt-16" style="max-width:640px;">' +
      '<h3>Completar Cidade / Placa / Causador manualmente</h3>' +
      '<p class="text-muted" style="font-size:13px;">O CSV do ATS não traz cidade, placa nem causador. Você pode editar direto na tela "Registros", ou colar aqui uma lista no formato abaixo (uma linha por dia) para preencher em lote:</p>' +
      '<p class="text-muted" style="font-size:12px;"><code>Motorista; Data(DD/MM/AAAA); Cidade; Placa; Causador</code></p>' +
      '<textarea id="bulkText" rows="6" style="width:100%; font-family:monospace; font-size:12.5px; padding:8px; border:1px solid var(--border); border-radius:6px;" placeholder="ANTONIO CARLOS DA SILVA; 05/08/2026; Itajaí; ABC1D23; Trânsito"></textarea>' +
      '<div class="mt-16"><button class="btn-sm primary" id="bulkApply">Aplicar em lote</button></div>' +
      '<div id="bulkResult"></div>' +
    '</div>' +
    '<div class="panel mt-16" style="max-width:640px;">' +
      '<h3>Histórico de importações</h3><div id="importHistory" class="text-muted" style="font-size:13px;">Carregando...</div>' +
    '</div>';

  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  dropzone.addEventListener('click', function() { fileInput.click(); });
  dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', function() { dropzone.classList.remove('drag'); });
  dropzone.addEventListener('drop', function(e) {
    e.preventDefault(); dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function() { if (fileInput.files.length) handleFile(fileInput.files[0]); });
  document.getElementById('bulkApply').addEventListener('click', applyBulkLocation);

  refreshImportHistory();
}


function handleFile(file) {
  var resultBox = document.getElementById('importResult');
  resultBox.innerHTML = '<div class="alert alert-info mt-16">Importando "' + escapeHtml(file.name) + '"...</div>';

  var reader = new FileReader();
  reader.onload = function(evt) {
    var text = evt.target.result;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    Papa.parse(text, {
      header: true,
      delimiter: ';',
      quoteChar: '"',
      skipEmptyLines: true,
      complete: async function(results) {
        var parsed = parseAtsRows(results.data);
        if (parsed.records.length === 0) {
          resultBox.innerHTML = '<div class="alert alert-error mt-16">Nenhum registro válido encontrado no arquivo.</div>';
          return;
        }
        try {
          var summary = await upsertRecords(parsed.records, file.name);
          resultBox.innerHTML =
            '<div class="alert alert-success mt-16">Importação concluída!</div>' +
            '<div class="import-summary">' +
              '<div class="row"><span>Total de linhas processadas</span><b>' + summary.total + '</b></div>' +
              '<div class="row"><span>Registros novos</span><b>' + summary.novos + '</b></div>' +
              '<div class="row"><span>Registros atualizados</span><b>' + summary.atualizados + '</b></div>' +
              (summary.removidos > 0 ? '<div class="row"><span>Registros removidos (não existem mais no arquivo)</span><b>' + summary.removidos + '</b></div>' : '') +
            '</div>' +
            (parsed.errors.length ? '<div class="alert alert-warn mt-16">' + parsed.errors.length + ' linha(s) ignorada(s).</div>' : '');
        } catch (err) {
          resultBox.innerHTML = '<div class="alert alert-error mt-16">' + err.message + '</div>';
        }
        refreshImportHistory();
      },
      error: function(err) {
        resultBox.innerHTML = '<div class="alert alert-error mt-16">Erro ao ler o CSV: ' + err.message + '</div>';
      },
    });
  };
  reader.readAsText(file, 'UTF-8');
}

async function refreshImportHistory() {
  var box = document.getElementById('importHistory');
  var { data: imports, error } = await sb.from('imports').select('*').order('imported_at', { ascending: false }).limit(100);
  if (error) { box.innerHTML = 'Erro ao carregar histórico: ' + error.message; return; }
  if (!imports || imports.length === 0) { box.innerHTML = 'Nenhuma importação realizada ainda.'; return; }
  box.innerHTML = '<table class="users-table"><thead><tr><th>Arquivo</th><th>Data</th><th>Por</th><th>Novos</th><th>Atualizados</th><th>Removidos</th></tr></thead><tbody>' +
    imports.map(function(i) {
      return '<tr><td>' + escapeHtml(i.filename || '-') + '</td><td>' + new Date(i.imported_at).toLocaleString('pt-BR') + '</td><td>' + escapeHtml(i.imported_by_username || '-') + '</td><td>' + i.novos + '</td><td>' + i.atualizados + '</td><td>' + (i.removidos || 0) + '</td></tr>';
    }).join('') + '</tbody></table>';
}

async function applyBulkLocation() {
  var resultBox = document.getElementById('bulkResult');
  var text = document.getElementById('bulkText').value.trim();
  if (!text) return;

  var items = text.split('\n').map(function(l) { return l.trim(); }).filter(Boolean).map(function(line) {
    var parts = line.split(';').map(function(p) { return p.trim(); });
    return { condutor: parts[0] || '', data: parts[1] || '', cidade: parts[2] || '', placa: parts[3] || '', causador: parts[4] || '' };
  });

  resultBox.innerHTML = '<div class="alert alert-info mt-16">Aplicando...</div>';
  var matched = 0, notFound = 0;
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var payload = { updated_at: new Date().toISOString() };
    if (it.cidade) payload.cidade = it.cidade;
    if (it.placa) payload.placa = it.placa;
    if (it.causador) payload.causador = it.causador;
    var { data, error } = await sb.from('records').update(payload).eq('condutor', it.condutor).eq('data', it.data).select('id');
    if (error || !data || data.length === 0) notFound++; else matched++;
  }
  resultBox.innerHTML = '<div class="alert alert-success mt-16">' + matched + ' registro(s) atualizados. ' + notFound + ' não encontrados.</div>';
}

/* ================= USUÁRIOS ================= */
async function renderUsuarios() {
  if (CURRENT_USER.role !== 'admin') { content.innerHTML = '<div class="alert alert-error">Apenas administradores podem acessar esta página.</div>'; return; }
  content.innerHTML =
    '<div class="table-toolbar"><div></div><button class="btn-sm primary" id="newUserBtn">+ Novo usuário</button></div>' +
    '<div class="table-wrap" style="padding:4px;"><table class="users-table" id="usersTable">' +
    '<thead><tr><th>Usuário</th><th>Nome</th><th>Perfil</th><th>Criado em</th><th></th></tr></thead>' +
    '<tbody><tr><td colspan="5" class="text-muted" style="padding:16px;">Carregando...</td></tr></tbody></table></div>';

  document.getElementById('newUserBtn').addEventListener('click', openNewUserModal);
  refreshUsers();
}

async function refreshUsers() {
  var tbody = document.querySelector('#usersTable tbody');
  var { data: users, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { tbody.innerHTML = '<tr><td colspan="5">' + error.message + '</td></tr>'; return; }

  tbody.innerHTML = users.map(function(u) {
    var isSelf = u.id === CURRENT_USER.id;
    var roleCell = isSelf
      ? '<span class="role-pill ' + u.role + '">' + (u.role === 'admin' ? 'Administrador' : 'Usuário') + '</span>'
      : '<select class="role-select" data-id="' + u.id + '"><option value="user"' + (u.role === 'user' ? ' selected' : '') + '>Usuário</option><option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Administrador</option></select>';
    return '<tr><td>' + escapeHtml(u.username) + '</td><td>' + escapeHtml(u.full_name || '-') + '</td>' +
      '<td>' + roleCell + '</td>' +
      '<td>' + new Date(u.created_at).toLocaleDateString('pt-BR') + '</td>' +
      '<td>' + (isSelf ? '<span class="text-muted" style="font-size:12px;">você</span>' : '') + '</td></tr>';
  }).join('');

  tbody.querySelectorAll('.role-select').forEach(function(sel) {
    sel.addEventListener('change', async function() {
      var { error } = await sb.from('profiles').update({ role: sel.value }).eq('id', sel.dataset.id);
      if (error) { alert('Erro ao alterar perfil: ' + error.message); refreshUsers(); }
    });
  });
}

function openNewUserModal() {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-box"><h3>Novo usuário</h3>' +
      '<div class="field"><label>Nome completo</label><input type="text" id="nuName" /></div>' +
      '<div class="field"><label>Usuário (login)</label><input type="text" id="nuUsername" /></div>' +
      '<div class="field"><label>Senha</label><div class="pw-wrap"><input type="password" id="nuPassword" /><button type="button" class="pw-toggle" id="nuPwToggle">mostrar</button></div></div>' +
      '<div class="field"><label>Perfil</label><select id="nuRole"><option value="user">Usuário</option><option value="admin">Administrador</option></select></div>' +
      '<div id="nuError" class="alert alert-error hidden"></div>' +
      '<div class="modal-actions"><button class="btn-sm" id="nuCancel">Cancelar</button><button class="btn-sm primary" id="nuSave">Criar</button></div>' +
    '</div>';
  document.body.appendChild(overlay);

  document.getElementById('nuPwToggle').addEventListener('click', function() {
    var inp = document.getElementById('nuPassword');
    var isPw = inp.type === 'password';
    inp.type = isPw ? 'text' : 'password';
    document.getElementById('nuPwToggle').textContent = isPw ? 'ocultar' : 'mostrar';
  });
  document.getElementById('nuCancel').addEventListener('click', function() { overlay.remove(); });
  document.getElementById('nuSave').addEventListener('click', async function() {
    var fullName = document.getElementById('nuName').value.trim();
    var username = document.getElementById('nuUsername').value.trim();
    var password = document.getElementById('nuPassword').value;
    var role = document.getElementById('nuRole').value;
    var errBox = document.getElementById('nuError');
    var saveBtn = document.getElementById('nuSave');
    errBox.classList.add('hidden');

    if (!username || !password) { errBox.textContent = 'Usuário e senha são obrigatórios.'; errBox.classList.remove('hidden'); return; }
    if (password.length < 6) { errBox.textContent = 'A senha deve ter pelo menos 6 caracteres.'; errBox.classList.remove('hidden'); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Criando...';

    // Usa um cliente Supabase TEMPORÁRIO e separado pra criar o novo usuário —
    // assim a sessão do admin (você) que está logado agora não é substituída
    // pela sessão do usuário recém-criado.
    var tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false },
    });

    var { data, error } = await tempClient.auth.signUp({
      email: usernameToEmail(username),
      password: password,
      options: { data: { username: username, full_name: fullName } },
    });

    if (error) {
      errBox.textContent = (error.message.indexOf('already') !== -1 || error.message.indexOf('registered') !== -1)
        ? 'Já existe um usuário com esse nome.' : ('Erro ao criar: ' + error.message);
      errBox.classList.remove('hidden');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Criar';
      return;
    }

    // Se marcou "Administrador", promove logo em seguida (via sessão do admin
    // atual — a única forma seguramente permitida pelas regras do banco).
    if (role === 'admin' && data.user) {
      await sb.from('profiles').update({ role: 'admin' }).eq('id', data.user.id);
    }

    overlay.remove();
    refreshUsers();
  });
}
